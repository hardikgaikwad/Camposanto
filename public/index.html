<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camposanto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 30V14a10 10 0 0 1 20 0v16z' fill='none' stroke='%23e0a64a' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="banner" aria-hidden="true"></div>
  <svg class="moon" viewBox="0 0 60 60" aria-hidden="true"><path d="M40 6a24 24 0 1 0 14 38A20 20 0 0 1 40 6z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>

  <header>
    <h1>Camposanto</h1>
    <p class="sub" id="sub">a quiet field for projects that stopped</p>
    <div class="controls">
      <input id="root" spellcheck="false" aria-label="Folder to scan">
      <select id="model" aria-label="Model"></select>
      <button id="bury" title="Write an epitaph for every grave">bury all</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <main id="field"></main>

  <svg id="ghost" viewBox="0 0 24 30" aria-hidden="true"><path d="M3 28V12a9 9 0 0 1 18 0v16l-3-3-3 3-3-3-3 3-3-3z" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/></svg>

  <aside id="panel" aria-live="polite">
    <button id="close" aria-label="Close">×</button>
    <h2 id="p-name"></h2>
    <p class="years" id="p-years"></p>
    <dl id="p-stats"></dl>
    <pre id="p-text" class="inscription"></pre>
    <button id="resurrect">resurrect</button>
    <div id="p-revive" class="revive"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
